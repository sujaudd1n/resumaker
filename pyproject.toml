[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resumaker"
dynamic = ["version"]
description =  "Effortlessly create multiple, ATS-friendly resumes from a single YAML file with Resumaker."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["Resume", "Resume Maker", "Resumaker"]
authors = [
  { name = "Md Sujauddin Sekh" }
]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Text Processing :: Markup :: LaTeX",
  "Environment :: Console",
]
dependencies = [
  "PyYAML==6.0.2"
]

[project.urls]
Homepage = "https://github.com/sujaudd1n/resumaker"
Documentation = "https://github.com/sujaudd1n/resumaker"
Issues = "https://github.com/sujaudd1n/resumaker/issues"
Source = "https://github.com/sujaudd1n/resumaker"

[project.scripts]
resumaker = "resumaker.__main__:main"

[tool.hatch.version]
path = "src/resumaker/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/resumaker tests}"


[tool.pytest.ini_options]
markers = [
  "fixture_data",
  "create_file"
]

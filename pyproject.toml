[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resumaker"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Sujauddin", email = "61101752+sujaudd1n@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/Sujauddin/resumaker#readme"
Issues = "https://github.com/Sujauddin/resumaker/issues"
Source = "https://github.com/Sujauddin/resumaker"

[tool.hatch.version]
path = "src/resumaker/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/resumaker tests}"

[tool.coverage.run]
source_pkgs = ["resumaker", "tests"]
branch = true
parallel = true
omit = [
  "src/resumaker/__about__.py",
]

[tool.coverage.paths]
resumaker = ["src/resumaker", "*/resumaker/src/resumaker"]
tests = ["tests", "*/resumaker/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
